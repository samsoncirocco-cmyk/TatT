<title>TatT — Ink Graph</title>
<style>
  /* Committed single-theme: ink-dark. The graph is drawn in tattoo-stencil
     colors on an ink ground; a light flip would break the metaphor. */
  :root {
    color-scheme: dark;
    --ground: #131118;
    --surface: #1b1823;
    --line: #2a2635;
    --ink: #ede9e0;
    --muted: #8d8798;
    --artist: #8b66d9;  /* stencil violet */
    --shop:   #b8862b;  /* flash gold */
    --city:   #c25539;  /* skin coral */
    --style:  #2fa37e;  /* sage teal */
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  header {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .wordmark { font-weight: 800; letter-spacing: 0.14em; font-size: 15px; }
  .wordmark span { color: var(--artist); }
  .stats { display: flex; gap: 18px; align-items: baseline; }
  .stat { display: flex; gap: 6px; align-items: baseline; }
  .stat b {
    font: 700 17px/1 ui-monospace, "SF Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .stat .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .stat small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
  .progress { flex: 1 1 160px; min-width: 140px; max-width: 320px; }
  .progress .bar {
    height: 6px; background: var(--line); border-radius: 3px; overflow: hidden;
  }
  .progress .fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--artist), var(--style));
  }
  .progress small {
    color: var(--muted); font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .snapshot { color: var(--muted); font-size: 11px; }

  .controls {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 8px 18px; background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .controls input[type="search"], .controls select {
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-size: 13px;
  }
  .controls input[type="search"] { width: 210px; }
  .controls input[type="search"]:focus, .controls select:focus,
  .chip:focus-visible, button:focus-visible {
    outline: 2px solid var(--artist); outline-offset: 1px;
  }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line); border-radius: 999px;
    background: none; color: var(--ink);
    padding: 4px 12px; font-size: 12px; cursor: pointer;
    letter-spacing: 0.04em;
  }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .chip[aria-pressed="false"] { opacity: 0.35; }
  .chip b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .hint { color: var(--muted); font-size: 11px; margin-left: auto; }

  #stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }

  #tip {
    position: absolute; pointer-events: none; display: none; z-index: 5;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 12px; max-width: 260px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5); font-size: 12.5px;
  }
  #tip .t-name { font-weight: 700; font-size: 13.5px; }
  #tip .t-kind {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
  }
  #tip .t-meta { color: var(--muted); margin-top: 3px; }
  #tip .t-ig { color: var(--artist); font-family: ui-monospace, Menlo, monospace; }

  #tableview {
    position: absolute; inset: 0; overflow: auto; z-index: 4;
    background: var(--ground); padding: 12px 18px; display: none;
  }
  #tableview table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  #tableview th {
    text-align: left; color: var(--muted); font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 6px 10px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--ground);
  }
  #tableview td { padding: 5px 10px; border-bottom: 1px solid var(--line); }
  #tableview td.ig { font-family: ui-monospace, Menlo, monospace; color: var(--artist); }
  .toggle-table {
    background: none; border: 1px solid var(--line); border-radius: 6px;
    color: var(--muted); padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
</style>

<div id="app">
  <header>
    <div class="wordmark">TATT <span>/</span> INK GRAPH</div>
    <div class="stats" id="stats"></div>
    <div class="progress">
      <div class="bar"><div class="fill" id="progfill" style="width:0%"></div></div>
      <small id="progtext"></small>
    </div>
    <div class="snapshot" id="snapshot"></div>
  </header>

  <div class="controls">
    <input type="search" id="q" placeholder="Search artist, shop, @handle…" aria-label="Search the graph">
    <select id="cityFilter" aria-label="Filter by city"><option value="">All cities</option></select>
    <div class="legend" id="legend" role="group" aria-label="Node types"></div>
    <button class="toggle-table" id="tableBtn" aria-pressed="false">Table view</button>
    <span class="hint">drag to pan · scroll to zoom · click an artist to open Instagram</span>
  </div>

  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="tip" role="status"></div>
    <div id="tableview"></div>
  </div>
</div>

  const n = { kind: 'shop', name, city: ci, rating, reviews,
              artists: 0, id: nodes.length, deg: 0 };
  cityNodes[ci].shops++;
  nodes.push(n);
  edges.push({ a: n.id, b: cityNodes[ci].id, kind: 'loc' });

});

  const n = { kind: 'artist', name, ig, shop: si, styles, hasImg,

  shopNodes[si].artists++;
  nodes.push(n);
  edges.push({ a: n.id, b: shopNodes[si].id, kind: 'works' });
  for (const st of styles) {
    styleNodes[st].count++;

});

  if (n.kind === 'city') return 6 + Math.sqrt(n.shops) * 2.2;
  if (n.kind === 'style') return 5 + Math.sqrt(n.count) * 1.4;
  if (n.kind === 'shop') return 3 + Math.sqrt(n.artists) * 1.6;

/* radial init: cities on an outer ring, shops around their city,

/* ---------- force simulation (grid-bucketed repulsion) ---------- */
let alpha = reduceMotion ? 0.3 : 1;
const CELL = 46;
function step() {
  const grid = new Map();
  for (const n of nodes) {
    const k = ((n.x / CELL) | 0) + ':' + ((n.y / CELL) | 0);
    (grid.get(k) || grid.set(k, []).get(k)).push(n);
  }
  for (const n of nodes) {
    const gx = (n.x / CELL) | 0, gy = (n.y / CELL) | 0;
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const cell = grid.get((gx + dx) + ':' + (gy + dy));
      if (!cell) continue;
      for (const m of cell) {
        if (m.id <= n.id) continue;
        let ddx = n.x - m.x, ddy = n.y - m.y;
        let d2 = ddx * ddx + ddy * ddy;
        if (d2 === 0) { ddx = Math.random() - 0.5; ddy = Math.random() - 0.5; d2 = 0.01; }
        if (d2 > CELL * CELL) continue;
        const d = Math.sqrt(d2);
        const overlap = (n.r + m.r + 4) - d;
        const f = (overlap > 0 ? overlap * 0.24 : 60 / d2) * alpha;
        const fx = (ddx / d) * f, fy = (ddy / d) * f;
        n.vx += fx; n.vy += fy; m.vx -= fx; m.vy -= fy;
      }
    }
  }
  for (let i = 0; i < cityNodes.length; i++) for (let j = i + 1; j < cityNodes.length; j++) {
    const a = cityNodes[i], b = cityNodes[j];
    const dx = a.x - b.x, dy = a.y - b.y;
    const d2 = dx * dx + dy * dy || 1;
    if (d2 > 420 * 420 * WORLD_SCALE) continue;
    const d = Math.sqrt(d2), f = 5200 * WORLD_SCALE / d2 * alpha;
    a.vx += dx / d * f; a.vy += dy / d * f;
    b.vx -= dx / d * f; b.vy -= dy / d * f;
  }
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    const rest = e.kind === 'loc' ? 95 : e.kind === 'works' ? 34 : 260;
    const k = e.kind === 'style' ? 0.0022 : 0.02;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = (d - rest) * k * alpha;
    a.vx += (dx / d) * f; a.vy += (dy / d) * f;
    b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
  }

  for (const n of nodes) {
    n.vx += (CX - n.x) * 0.00035 * alpha;
    n.vy += (CY - n.y) * 0.00035 * alpha;
    n.x += n.vx; n.y += n.vy;
    n.vx *= 0.82; n.vy *= 0.82;
  }

  for (const s of styleNodes) {
    s.x += (s.ax - s.x) * 0.3; s.y += (s.ay - s.y) * 0.3;
    s.vx = 0; s.vy = 0;
  }

  if (!cityFilter) return true;
  const ci = +cityFilter;
  if (n.kind === 'city') return n.id === cityNodes[ci].id;
  if (n.kind === 'shop') return n.city === ci;
  if (n.kind === 'artist') return shopNodes[n.shop].city === ci;
  return true; // styles span cities
}
function matchesQuery(n) {
  if (!query) return false;
  const q = query.toLowerCase();
  return n.name.toLowerCase().includes(q) || (n.ig && n.ig.includes(q));
}

function draw() {
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = GROUND;
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(view.x, view.y);
  ctx.scale(view.k, view.k);

  const hasQuery = !!query;
  const focus = hovered;
  const neighbors = new Set();
  if (focus) {
    neighbors.add(focus.id);
    for (const e of adj[focus.id]) { neighbors.add(e.a); neighbors.add(e.b); }
  }

  // edges — style edges only when a style/artist is in focus
  ctx.lineWidth = 1 / view.k;
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    if (!nodeVisible(a) || !nodeVisible(b)) continue;
    const inFocus = focus && (e.a === focus.id || e.b === focus.id);
    if (e.kind === 'style' && !inFocus) continue;
    ctx.strokeStyle = inFocus
      ? (e.kind === 'style' ? 'rgba(47,163,126,0.8)' : 'rgba(237,233,224,0.55)')
      : 'rgba(141,135,152,0.13)';
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // nodes
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const dim = (focus && !neighbors.has(n.id)) || (hasQuery && !matchesQuery(n) && n.kind === 'artist');
    ctx.globalAlpha = dim ? 0.16 : 1;
    ctx.fillStyle = COLORS[n.kind];
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
    if (hasQuery && matchesQuery(n)) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = '#ede9e0'; ctx.lineWidth = 1.6 / view.k;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3 / view.k, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // labels: cities + styles always; shops when zoomed; artist on focus
  ctx.textAlign = 'center';
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const show =
      (n.kind === 'city' && (n.ringIdx % labelStep() === 0 || cityFilter || (hovered && hovered.id === n.id))) ||
      n.kind === 'style' ||
      (n.kind === 'shop' && view.k > 1.15) ||
      (focus && neighbors.has(n.id) && view.k > 0.8);
    if (!show) continue;
    if (focus && !neighbors.has(n.id) && n.kind !== 'city') ctx.globalAlpha = 0.25;
    const size = n.kind === 'city' ? 13 : n.kind === 'style' ? 11 : 9.5;
    ctx.font = `${n.kind === 'city' ? '700' : '400'} ${size / view.k}px -apple-system, sans-serif`;
    ctx.fillStyle = n.kind === 'city' ? '#ede9e0' : '#8d8798';
    ctx.fillText(n.name, n.x, n.y - n.r - 5 / view.k);
    ctx.globalAlpha = 1;
  }
}

function loop() {
  if (alpha > 0) { step(); needsDraw = true; }
  if (needsDraw) { draw(); needsDraw = false; }
  requestAnimationFrame(loop);
}

/* ---------- interaction ---------- */
function pick(mx, my) {
  const x = (mx - view.x) / view.k, y = (my - view.y) / view.k;
  let best = null, bestD = 12 / view.k + 4;
  for (const n of nodes) {
    if (!nodeVisible(n)) continue;
    const d = Math.hypot(n.x - x, n.y - y) - n.r;
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

const tip = document.getElementById('tip');
function showTip(n, mx, my) {
  let meta = '';
  if (n.kind === 'artist') {
    const shop = shopNodes[n.shop];
    const city = DATA.cities[shop.city];
    const st = n.styles.map(i => DATA.styles[i]).join(', ');
    meta = `<div class="t-ig">@${n.ig}</div>
            <div class="t-meta">${shop.name} · ${city}${st ? '<br>' + st : ''}</div>`;
  } else if (n.kind === 'shop') {
    meta = `<div class="t-meta">${DATA.cities[n.city]} · ${n.artists} artist${n.artists === 1 ? '' : 's'}
            ${n.rating ? ` · ★ ${n.rating} (${n.reviews} Google reviews)` : ''}</div>`;
  } else if (n.kind === 'city') {
    meta = `<div class="t-meta">${n.shops} shops</div>`;
  } else {
    meta = `<div class="t-meta">${n.count} artists tagged</div>`;
  }
  tip.innerHTML = `<div class="t-kind" style="color:${COLORS[n.kind]}">${n.kind}</div>
                   <div class="t-name">${n.name}</div>${meta}`;
  tip.style.display = 'block';
  const stage = document.getElementById('stage').getBoundingClientRect();
  tip.style.left = Math.min(mx + 14, stage.width - 270) + 'px';
  tip.style.top = Math.min(my + 14, stage.height - 110) + 'px';
}

let dragging = false, moved = false, lastX = 0, lastY = 0;
cv.addEventListener('pointerdown', e => {
  dragging = true; moved = false; lastX = e.offsetX; lastY = e.offsetY;
  cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (dragging) {
    const dx = e.offsetX - lastX, dy = e.offsetY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    view.x += dx; view.y += dy; lastX = e.offsetX; lastY = e.offsetY;
    needsDraw = true;
  } else {
    const n = pick(e.offsetX, e.offsetY);
    if (n !== hovered) { hovered = n; needsDraw = true; }
    if (n) showTip(n, e.offsetX, e.offsetY); else tip.style.display = 'none';
    cv.style.cursor = n ? 'pointer' : 'grab';
  }
});
cv.addEventListener('pointerup', e => {
  dragging = false; cv.classList.remove('dragging');
  if (!moved) {
    const n = pick(e.offsetX, e.offsetY);
    if (n && n.kind === 'artist') window.open('https://instagram.com/' + n.ig, '_blank');
  }
});
cv.addEventListener('pointerleave', () => { hovered = null; tip.style.display = 'none'; needsDraw = true; });
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * 0.0016);
  const nx = e.offsetX, ny = e.offsetY;
  view.x = nx - (nx - view.x) * f;
  view.y = ny - (ny - view.y) * f;
  view.k *= f;
  needsDraw = true;
}, { passive: false });

/* ---------- header / controls ---------- */
const statsEl = document.getElementById('stats');
const counts = [
  ['artist', DATA.artists.length, 'artists'],
  ['shop', DATA.shops.length, 'shops'],
  ['city', DATA.cities.length, 'cities'],
  ['style', DATA.styles.length, 'styles'],
];
statsEl.innerHTML = counts.map(([k, v, label]) =>
  `<span class="stat"><span class="dot" style="background:${COLORS[k]}"></span>
   <b>${v.toLocaleString()}</b> <small>${label}</small></span>`).join('');
const combined = DATA.artists.length + DATA.shops.length;
document.getElementById('progfill').style.width = Math.min(100, combined / DATA.target * 100) + '%';
document.getElementById('progtext').textContent =
  `${combined.toLocaleString()} / ${DATA.target.toLocaleString()} toward target`;
document.getElementById('snapshot').textContent = `snapshot ${DATA.t}`;

const legend = document.getElementById('legend');
for (const [k, v, label] of counts) {
  const btn = document.createElement('button');
  btn.className = 'chip'; btn.setAttribute('aria-pressed', 'true');
  btn.innerHTML = `<span class="dot" style="background:${COLORS[k]}"></span>${label}`;
  btn.onclick = () => {
    kinds[k] = !kinds[k];
    btn.setAttribute('aria-pressed', String(kinds[k]));
    needsDraw = true;
  };
  legend.appendChild(btn);
}

const citySel = document.getElementById('cityFilter');
DATA.cities.forEach((c, i) => {
  const o = document.createElement('option'); o.value = i; o.textContent = c;
  citySel.appendChild(o);
});
citySel.onchange = () => { cityFilter = citySel.value; needsDraw = true; };
document.getElementById('q').oninput = e => { query = e.target.value.trim(); needsDraw = true; };

/* ---------- table view (accessible alternative) ---------- */
const tableBtn = document.getElementById('tableBtn');
const tableview = document.getElementById('tableview');
let tableBuilt = false;
tableBtn.onclick = () => {
  const open = tableview.style.display !== 'block';
  if (open && !tableBuilt) {
    tableBuilt = true;
    const rows = artistNodes.map(a => {
      const s = shopNodes[a.shop];
      return `<tr><td>${a.name}</td><td class="ig"><a style="color:inherit" target="_blank"
        href="https://instagram.com/${a.ig}">@${a.ig}</a></td>
        <td>${s.name}</td><td>${DATA.cities[s.city]}</td>
        <td>${a.styles.map(i => DATA.styles[i]).join(', ')}</td></tr>`;
    }).join('');
    tableview.innerHTML = `<table>
      <thead><tr><th>Artist</th><th>Instagram</th><th>Shop</th><th>City</th><th>Styles</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }
  tableview.style.display = open ? 'block' : 'none';
  tableBtn.setAttribute('aria-pressed', String(open));
  tableBtn.textContent = open ? 'Graph view' : 'Table view';
};

addEventListener('resize', fitView);
fitView();
loop();
</script>
