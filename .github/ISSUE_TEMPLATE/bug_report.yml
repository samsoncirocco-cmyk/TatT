name: Bug report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See error
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "prod / local, browser, Node version"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Logs / screenshots
      description: Paste any relevant console output or screenshots.
    validations:
      required: false
